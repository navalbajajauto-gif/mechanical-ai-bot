name: Scheduled Posts (backup trigger)

# This is a redundant/backup path for the 8AM & 6PM IST posts, independent of
# whether the Render web service is awake. The primary interactive bot
# (/ask, /interview, image analysis, etc.) runs continuously on Render and
# is NOT covered by this workflow - GitHub Actions cannot host a persistent
# listener, only scheduled runs.

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST  (UTC+5:30)
    - cron: "30 12 * * *"  # 18:00 IST
  workflow_dispatch:
    inputs:
      which:
        description: "Which post to send"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine which post (scheduled runs)
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "which=${{ inputs.which }}" >> "$GITHUB_OUTPUT"
          else
            hour_utc=$(date -u +%H)
            if [ "$hour_utc" = "02" ]; then
              echo "which=morning" >> "$GITHUB_OUTPUT"
            else
              echo "which=evening" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Send post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: python bot.py --mode once --which ${{ steps.which.outputs.which }}